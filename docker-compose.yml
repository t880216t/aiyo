services:
  aiyo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiyo
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/aiyo:/home/aiyo/.config/aiyo
      - ./data/opencode/share:/home/aiyo/.local/share/opencode
      - ./data/opencode/state:/home/aiyo/.local/state/opencode
      - ./data/opencode/config:/home/aiyo/.config/opencode
      - ./data/ssh:/home/aiyo/.ssh
      - ./workspaces:/home/aiyo/workspaces
    environment:
      # Docker binds AiYo to 0.0.0.0 for port mapping, so UI auth is required.
      # Set this before starting, for example:
      #   AIYO_UI_PASSWORD="$(openssl rand -base64 24)" docker compose up -d
      AIYO_UI_PASSWORD: ${AIYO_UI_PASSWORD:?Set AIYO_UI_PASSWORD before exposing AiYo through Docker}
    # AIYO_HOST: 0.0.0.0  # Bind address (default in Docker entrypoint: 0.0.0.0)
    # AIYO_TUNNEL_PROVIDER: cloudflare
    # AIYO_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # AIYO_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # AIYO_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # AIYO_TUNNEL_CONFIG: /home/aiyo/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true # skip start opencode
    # AIYO_OPENCODE_HOSTNAME: 0.0.0.0 # Bind OpenCode to all interfaces
    restart: unless-stopped
